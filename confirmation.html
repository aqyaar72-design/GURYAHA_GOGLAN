<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Booking Confirmed | Elite Furnished Homes</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            padding: 30px 15px;
        }

        .confirmation-container {
            max-width: 800px;
            margin: 30px auto;
        }

        .confirmation-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #e8f8ee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #20a45b;
            font-size: 40px;
        }

        .title {
            text-align: center;
            color: #20a45b;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .booking-id-box {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-bottom: 30px;
        }

        .booking-id-box span {
            display: block;
            color: #666;
            font-size: 14px;
            margin-bottom: 7px;
        }

        .booking-id {
            font-size: 22px;
            font-weight: bold;
            word-break: break-word;
        }

        .section-title {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .detail-box {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
        }

        .detail-label {
            color: #777;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .detail-value {
            font-weight: 600;
            word-break: break-word;
        }

        .special-request {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            flex: 1;
            min-width: 180px;
            padding: 14px 18px;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
        }

        .home-btn {
            background: #222;
            color: white;
        }

        .print-btn {
            background: #e5e7eb;
            color: #222;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
        }

        .no-booking {
            text-align: center;
            padding: 40px 10px;
        }

        .no-booking h2 {
            margin-bottom: 10px;
        }

        @media (max-width: 600px) {

            .confirmation-card {
                padding: 22px;
            }

            .title {
                font-size: 26px;
            }

            .details {
                grid-template-columns: 1fr;
            }

        }

        @media print {

            body {
                background: white;
                padding: 0;
            }

            .confirmation-card {
                box-shadow: none;
            }

            .buttons {
                display: none;
            }

        }

    </style>
</head>

<body>

    <div class="confirmation-container">

        <div class="confirmation-card">

            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>

            <h1 class="title">
                Booking Confirmed ✅
            </h1>

            <p class="subtitle">
                Your booking has been successfully submitted.
            </p>


            <!-- BOOKING ID -->

            <div class="booking-id-box">

                <span>
                    Your Booking ID
                </span>

                <div
                    id="bookingId"
                    class="booking-id">
                    Loading...
                </div>

            </div>


            <!-- CUSTOMER DETAILS -->

            <h2 class="section-title">
                Customer Details
            </h2>

            <div class="details">

                <div class="detail-box">

                    <div class="detail-label">
                        Full Name
                    </div>

                    <div
                        id="fullName"
                        class="detail-value">
                        -
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Phone
                    </div>

                    <div
                        id="phone"
                        class="detail-value">
                        -
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        WhatsApp
                    </div>

                    <div
                        id="whatsapp"
                        class="detail-value">
                        -
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Email
                    </div>

                    <div
                        id="email"
                        class="detail-value">
                        -
                    </div>

                </div>

            </div>


            <!-- BOOKING DETAILS -->

            <h2 class="section-title">
                Booking Details
            </h2>

            <div class="details">

                <div class="detail-box">

                    <div class="detail-label">
                        Home Type
                    </div>

                    <div
                        id="homeType"
                        class="detail-value">
                        -
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Check-in
                    </div>

                    <div
                        id="checkIn"
                        class="detail-value">
                        -
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Check-out
                    </div>

                    <div
                        id="checkOut"
                        class="detail-value">
                        -
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Adults
                    </div>

                    <div
                        id="adults"
                        class="detail-value">
                        -
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Children
                    </div>

                    <div
                        id="children"
                        class="detail-value">
                        -
                    </div>

                </div>

            </div>


            <!-- SPECIAL REQUEST -->

            <h2 class="section-title">
                Special Request
            </h2>

            <div
                id="specialRequest"
                class="special-request">
                -
            </div>


            <!-- BUTTONS -->

            <div class="buttons">

                <button
                    class="btn print-btn"
                    onclick="window.print()">

                    <i class="fa-solid fa-print"></i>
                    Print Receipt

                </button>


                <a
                    href="index.html"
                    class="btn home-btn">

                    <i class="fa-solid fa-house"></i>
                    Back to Home

                </a>


                <a
                    id="whatsappButton"
                    href="#"
                    target="_blank"
                    class="btn whatsapp-btn">

                    <i class="fa-brands fa-whatsapp"></i>
                    WhatsApp Confirmation

                </a>

            </div>

        </div>

    </div>


    <!-- CONFIRMATION JAVASCRIPT -->

    <script>

        // =========================================
        // GET SAVED BOOKING
        // =========================================

        const savedBooking =
            localStorage.getItem(
                "eliteBooking"
            );


        // =========================================
        // CHECK BOOKING
        // =========================================

        if (!savedBooking) {

            document.querySelector(
                ".confirmation-card"
            ).innerHTML = `

                <div class="no-booking">

                    <div class="success-icon">
                        <i class="fa-solid fa-calendar-xmark"></i>
                    </div>

                    <h2>
                        Booking lama helin
                    </h2>

                    <p>
                        Ma jiro booking information
                        oo ku kaydsan browser-kan.
                    </p>

                    <br>

                    <a
                        href="booking.html"
                        class="btn home-btn">

                        Make a Booking

                    </a>

                </div>

            `;

        } else {

            // =====================================
            // READ BOOKING
            // =====================================

            const booking =
                JSON.parse(savedBooking);


            // =====================================
            // DISPLAY BOOKING ID
            // =====================================

            document.getElementById(
                "bookingId"
            ).textContent =
                booking.booking_reference || "-";


            // =====================================
            // CUSTOMER
            // =====================================

            document.getElementById(
                "fullName"
            ).textContent =
                booking.full_name || "-";


            document.getElementById(
                "phone"
            ).textContent =
                booking.phone || "-";


            document.getElementById(
                "whatsapp"
            ).textContent =
                booking.whatsapp || "-";


            document.getElementById(
                "email"
            ).textContent =
                booking.email || "-";


            // =====================================
            // BOOKING DETAILS
            // =====================================

            document.getElementById(
                "homeType"
            ).textContent =
                booking.home_type || "-";


            document.getElementById(
                "checkIn"
            ).textContent =
                booking.check_in || "-";


            document.getElementById(
                "checkOut"
            ).textContent =
                booking.check_out || "-";


            document.getElementById(
                "adults"
            ).textContent =
                booking.adults ?? "-";


            document.getElementById(
                "children"
            ).textContent =
                booking.children ?? "-";


            document.getElementById(
                "specialRequest"
            ).textContent =
                booking.special_request || "None";


            // =====================================
            // WHATSAPP MESSAGE
            // =====================================

            const whatsappNumber =
                booking.whatsapp ||
                booking.phone;


            if (whatsappNumber) {

                const cleanNumber =
                    whatsappNumber
                        .replace(/\D/g, "");


                const message =
                    `Assalaamu Alaikum Elite Furnished Homes%0A%0A` +
                    `My booking has been submitted successfully.%0A%0A` +
                    `Booking ID: ${booking.booking_reference}%0A` +
                    `Name: ${booking.full_name}%0A` +
                    `Home Type: ${booking.home_type}%0A` +
                    `Check-in: ${booking.check_in}%0A` +
                    `Check-out: ${booking.check_out}%0A%0A` +
                    `Thank you.`;


                document.getElementById(
                    "whatsappButton"
                ).href =
                    "https://wa.me/" +
                    cleanNumber +
                    "?text=" +
                    message;

            }

        }

    </script>

</body>
</html>
